services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: kingdom-proxy-nginx
    ports:
      - "4800:80"
    volumes:
      # Named volume shared with `api`. Started first (see api's
      # depends_on below) so this is the container that populates the
      # volume from its image on first run -- including the empty
      # kingdom-routes.conf that nginx.conf `include`s.
      - nginx-conf:/etc/nginx/conf.d
    networks:
      - kingdom-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: kingdom-proxy-api
    environment:
      KP_HTTP_HOST: "0.0.0.0"
      KP_HTTP_PORT: "9000"
      KP_DB_PATH: "/data/kingdom-proxy.db"
      KP_DOCKER_SOCKET: "/var/run/docker.sock"
      KP_NGINX_CONF_PATH: "/etc/nginx/conf.d/kingdom-routes.conf"
      KP_NGINX_CONTAINER_NAME: "kingdom-proxy-nginx"
      KP_NETWORK_NAME: "kingdom-net"
      KP_SYNC_INTERVAL_SECONDS: "30"
    ports:
      # Admin API stays on loopback by default -- it's unauthenticated.
      # Widen this only if you know what you're doing.
      - "127.0.0.1:4810:9000"
    volumes:
      - nginx-conf:/etc/nginx/conf.d
      - api-data:/data
      # Host-side path to the container engine's API socket. The default
      # is Docker's; running under Podman instead, set CONTAINER_ENGINE_SOCKET
      # before bringing the stack up -- e.g.
      #   CONTAINER_ENGINE_SOCKET=/run/podman/podman.sock podman-compose up -d --build   # rootful
      #   CONTAINER_ENGINE_SOCKET=$XDG_RUNTIME_DIR/podman/podman.sock podman-compose up -d --build   # rootless
      # (the socket must first be enabled -- see README's Podman section).
      # The container-internal path is unaffected: it's always
      # /var/run/docker.sock in there, matching KP_DOCKER_SOCKET's default
      # above, regardless of what the host side actually is.
      # Deliberately no ":z" here, unlike the TLS cert/key mounts in
      # docker-compose.prod.yml. ":z" relabels its target to the generic
      # shared-content type (container_file_t), which is right for plain
      # files but wrong for this socket: Podman's rootless API socket
      # already carries whatever label its own SELinux policy grants
      # containers "connectto" access to, and relabeling it to
      # container_file_t overwrites that with a type the policy does
      # *not* grant connectto on -- so on an SELinux-*enforcing* host
      # (RHEL/Fedora/CentOS) adding ":z" here doesn't just no-op, it
      # breaks the socket: connections fail with a generic "Could not
      # establish connection" (surfaced in the UI as "cannot reach
      # docker socket"), and the label change persists on the host file
      # even after the container is removed. If you've already hit
      # this (`ls -Z` on the socket shows container_file_t), recreate it
      # so Podman reapplies its normal label:
      #   systemctl --user stop podman.socket podman.service
      #   rm -f "$XDG_RUNTIME_DIR/podman/podman.sock"
      #   systemctl --user start podman.socket
      - ${CONTAINER_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - kingdom-net
    depends_on:
      - nginx
    restart: unless-stopped

  # An example service to route through kingdom-proxy: a tiny to-do app,
  # API + UI in one container (see examples/todo-app). Opt-in via the
  # "demo" profile so a plain `docker compose up` doesn't start it:
  #   docker compose --profile demo up -d --build
  # or use scripts/demo-up.sh, which also registers a route for it.
  # Not published on any host port -- it's meant to be reached only
  # through the proxy, same as any real app would be.
  demo:
    profiles: ["demo"]
    build:
      context: examples/todo-app
    container_name: kingdom-demo-todo-app
    networks:
      - kingdom-net
    restart: unless-stopped

networks:
  # Containers you want to route to must be attached to this network so
  # both nginx (which connects to them by name) and the api container
  # (which inspects them) can reach them. Existing containers can join
  # with: docker network connect kingdom-net <container>
  kingdom-net:
    name: kingdom-net

volumes:
  nginx-conf:
  api-data:

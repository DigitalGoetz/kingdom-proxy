# TLS-terminating production alternative to docker-compose.yml -- run this
# file *instead of* that one (not layered on top of it via `-f a -f b`;
# Compose concatenates list fields like `ports`/`volumes` across files
# rather than replacing them, which would leave the old plain-HTTP :4800
# mapping in place alongside this file's :80/:443 -- so it's a full,
# independent copy of the stack rather than an override):
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   podman compose -f docker-compose.prod.yml up -d --build
#
# See README.md's "HTTPS / TLS" section for the certificate setup this
# needs before first start, and the rootless-Podman/Docker privileged-port
# (<1024) caveat for binding host :80/:443 at all.
#
# Bring the dev stack down first if it's running (`compose down`, no `-f`)
# -- both files use the same container names, network, and volumes, so the
# two aren't meant to run at once.

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      args:
        NGINX_CONF: nginx.tls.conf
    container_name: kingdom-proxy-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx-conf:/etc/nginx/conf.d
      # Cert/key this stack does not generate or obtain itself -- bring
      # your own. Mounted as two independent files rather than one
      # directory since a real host's cert and key are rarely
      # co-located with matching names (e.g. RHEL/CentOS convention:
      # key under /etc/pki/tls/private/, cert under /etc/pki/tls/certs/,
      # named after the host, not "privkey"/"fullchain"). Point
      # TLS_CERT_FILE/TLS_KEY_FILE at wherever they actually are; each
      # defaults to the throwaway pair scripts/gen-dev-cert.sh writes to
      # ./certs/. TLS_CERT_FILE must be the full chain (this host's leaf
      # cert plus any intermediate CA certs) if clients need to validate
      # it -- a bare leaf cert from an internal CA will fail validation
      # for anyone who doesn't already trust that CA directly. ":z"
      # relabels for SELinux (common on Podman's usual hosts); harmless
      # no-op where SELinux isn't enforced.
      - ${TLS_CERT_FILE:-./certs/fullchain.pem}:/etc/nginx/certs/fullchain.pem:ro,z
      - ${TLS_KEY_FILE:-./certs/privkey.pem}:/etc/nginx/certs/privkey.pem:ro,z
    networks:
      - kingdom-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: kingdom-proxy-api
    environment:
      KP_HTTP_HOST: "0.0.0.0"
      KP_HTTP_PORT: "9000"
      KP_DB_PATH: "/data/kingdom-proxy.db"
      KP_DOCKER_SOCKET: "/var/run/docker.sock"
      KP_NGINX_CONF_PATH: "/etc/nginx/conf.d/kingdom-routes.conf"
      KP_NGINX_CONTAINER_NAME: "kingdom-proxy-nginx"
      KP_NETWORK_NAME: "kingdom-net"
      KP_SYNC_INTERVAL_SECONDS: "30"
    ports:
      # Admin API stays on loopback by default -- it's unauthenticated.
      # Widen this only if you know what you're doing.
      - "127.0.0.1:4810:9000"
    volumes:
      - nginx-conf:/etc/nginx/conf.d
      - api-data:/data
      # See docker-compose.yml's identical line for what this is, how to
      # point it at Docker vs. Podman's socket, and why it deliberately
      # has no ":z" (unlike the TLS cert/key mounts above, which do).
      - ${CONTAINER_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - kingdom-net
    depends_on:
      - nginx
    restart: unless-stopped

networks:
  kingdom-net:
    name: kingdom-net

volumes:
  nginx-conf:
  api-data:

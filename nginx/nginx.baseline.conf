# Baseline nginx configuration for kingdom-proxy.
#
# This file is static and owned by the repo -- it is NOT touched by
# kingdom-proxy-api. The API only ever writes to the file included at the
# bottom of the server block (conf.d/kingdom-routes.conf), which must exist
# (even if empty) before nginx starts -- see Dockerfile.nginx.

worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Docker's embedded DNS server. Combined with using variables in
  # proxy_pass (see kingdom-routes.conf, generated by ConfigGenerator),
  # this makes nginx re-resolve each route's container name on every
  # request instead of caching its IP at config-load/reload time -- so a
  # route keeps working across a `docker restart` of its target container.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Required for proxying WebSocket connections through routes that need it.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # kingdom-proxy-api's own admin API, reachable through the same front
    # door as every other route. "/_proxy" is reserved -- the API rejects
    # any route registered under it (see is_reserved_path_prefix in
    # api/server.cpp) so a dynamic route can never shadow this. The prefix
    # is stripped, so /_proxy/routes reaches the API's own /routes, etc.
    #
    # Uses the same resolver-backed variable pattern as generated routes
    # (see kingdom-routes.conf) so this keeps working across a restart of
    # the api container. "kingdom-proxy-api:9000" must match this stack's
    # api container_name and KP_HTTP_PORT in docker-compose.yml.
    # "^~" tells nginx that once this prefix is the longest matching one for
    # a request, it should stop -- skipping any regex (~ / ~*) locations
    # that would otherwise be checked next and could take precedence over a
    # plain prefix location regardless of length (e.g. a future
    # asset-caching rule keyed on file extension). Same reasoning applies
    # to every dynamic route location kingdom-routes.conf generates.
    location ^~ /_proxy/ {
      # See the comment on rewrite in ConfigGenerator::render
      # (src/nginx/config_generator.cpp) -- a variable in proxy_pass means
      # nginx always forwards the original request URI verbatim, so prefix
      # stripping has to happen here via `rewrite ... break` instead of a
      # trailing "/" on proxy_pass (which would silently do nothing).
      #
      # `set` MUST come before `rewrite ... break`: break stops the rewrite
      # module (which also implements `set`) from running any of its own
      # directives that follow it in the same location, so a `set` placed
      # after it would silently never execute -- leaving $kp_admin_api
      # uninitialized and every request here failing with a 500.
      set $kp_admin_api "http://kingdom-proxy-api:9000";
      rewrite ^/_proxy/(.*)$ /$1 break;
      proxy_pass $kp_admin_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The React dashboard (see web/), built by Dockerfile.nginx's web-build
    # stage into the image at /usr/share/nginx/html. It's a single page
    # with no client-side routing, so an unmatched path (an old route that
    # was deleted or disabled, a typo, a bot) should still fall through to
    # the same explicit 404 as before, not silently serve index.html with
    # a 200 -- a generic SPA-style `try_files $uri /index.html` fallback
    # would do exactly that for every unmatched request, since it always
    # finds *something* to serve.
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ @no_route;
    }

    location @no_route {
      default_type text/plain;
      return 404 "kingdom-proxy: no route configured for this path\n";
    }

    # Routes managed by kingdom-proxy-api. This file always exists (created
    # empty in Dockerfile.nginx) and is atomically overwritten by
    # ConfigGenerator whenever the route table changes.
    include /etc/nginx/conf.d/kingdom-routes.conf;
  }
}

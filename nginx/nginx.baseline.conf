# Baseline nginx configuration for kingdom-proxy: plain HTTP on :80, the
# dev/demo default (docker-compose.yml maps this to host :4800). For a
# TLS-terminating production alternative on :80(redirect)/:443, see
# nginx.tls.conf and docker-compose.prod.yml instead -- the two configs
# share their route/admin/dashboard behavior via kp-locations.conf so they
# can't drift apart.
#
# This file is static and owned by the repo -- it is NOT touched by
# kingdom-proxy-api, which only ever writes to the file included at the
# bottom of the server block (conf.d/kingdom-routes.conf, itself included
# via kp-locations.conf). That file, and conf.d/resolver.conf (see the
# `resolver` include below), both must exist (even if empty) before
# nginx's first start -- see Dockerfile.nginx.

worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # The container runtime's embedded DNS server -- Docker's is a fixed
  # 127.0.0.11, but Podman's (aardvark-dns) is the network's own gateway
  # address and varies per network, so it can't be hardcoded here. Instead
  # it's detected from /etc/resolv.conf at container start by
  # docker-entrypoint.d/40-kingdom-proxy-resolver.sh (which the official
  # nginx image runs automatically before nginx starts) and written to
  # this file, which always exists (created empty in Dockerfile.nginx) by
  # the time this is parsed. Combined with using variables in proxy_pass
  # (see kingdom-routes.conf, generated by ConfigGenerator), this makes
  # nginx re-resolve each route's container name on every request instead
  # of caching its IP at config-load/reload time -- so a route keeps
  # working across a restart of its target container.
  include /etc/nginx/conf.d/resolver.conf;

  # Required for proxying WebSocket connections through routes that need it.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80 default_server;
    server_name _;

    # Health check, admin API proxy, dashboard, and dynamic routes -- shared
    # with nginx.tls.conf's 443 server block so the two stay identical
    # except for listen/ssl_* directives. See that file for the
    # TLS-terminating production alternative to this plain-HTTP config.
    include /etc/nginx/kp-locations.conf;
  }
}

# Baseline nginx configuration for kingdom-proxy.
#
# This file is static and owned by the repo -- it is NOT touched by
# kingdom-proxy-api. The API only ever writes to the file included at the
# bottom of the server block (conf.d/kingdom-routes.conf), which must exist
# (even if empty) before nginx starts -- see Dockerfile.nginx.

worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Docker's embedded DNS server. Combined with using variables in
  # proxy_pass (see kingdom-routes.conf, generated by ConfigGenerator),
  # this makes nginx re-resolve each route's container name on every
  # request instead of caching its IP at config-load/reload time -- so a
  # route keeps working across a `docker restart` of its target container.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Required for proxying WebSocket connections through routes that need it.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      default_type text/plain;
      return 404 "kingdom-proxy: no route configured for this path\n";
    }

    # Routes managed by kingdom-proxy-api. This file always exists (created
    # empty in Dockerfile.nginx) and is atomically overwritten by
    # ConfigGenerator whenever the route table changes.
    include /etc/nginx/conf.d/kingdom-routes.conf;
  }
}

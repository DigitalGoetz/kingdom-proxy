# TLS-terminating nginx configuration for kingdom-proxy: plain HTTP on :80
# (health check + redirect to https only, no app traffic), the real
# front door on :443. Production alternative to nginx.baseline.conf's
# plain-HTTP default -- see docker-compose.prod.yml, which builds the
# nginx image with this file instead (via the NGINX_CONF build arg) and
# maps host :80/:443 to it. See README.md's "HTTPS / TLS" section for the
# certificate setup this depends on.
#
# This file is static and owned by the repo -- it is NOT touched by
# kingdom-proxy-api, which only ever writes to the file included at the
# bottom of each server block (conf.d/kingdom-routes.conf, itself included
# via kp-locations.conf). That file, and conf.d/resolver.conf (see the
# `resolver` include below), both must exist (even if empty) before
# nginx's first start -- see Dockerfile.nginx.

worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # See the identical comment in nginx.baseline.conf -- same detection,
  # shared by both server blocks below since it's declared at http{} level.
  include /etc/nginx/conf.d/resolver.conf;

  # Required for proxying WebSocket connections through routes that need it.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Plain HTTP: only the health check (so the container HEALTHCHECK, which
  # hits 127.0.0.1:80 unencrypted, keeps working unchanged -- see
  # Dockerfile.nginx) and a redirect to the https equivalent of whatever
  # was requested. No route/admin/dashboard traffic is served here.
  server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # Populated from a host directory bind-mounted read-only at this path
    # (see docker-compose.prod.yml's TLS_CERT_DIR-driven volume) -- bring
    # your own cert/key, this image doesn't generate or obtain one. nginx
    # refuses to start if either file is missing, so they must exist
    # before the container's first start.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # A conservative, broadly-compatible modern baseline (Mozilla's
    # "intermediate" profile: https://ssl-config.mozilla.org/) -- tighten
    # further (e.g. TLSv1.3-only, a narrower cipher list) if this doesn't
    # need to support older clients.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Health check, admin API proxy, dashboard, and dynamic routes -- shared
    # with nginx.baseline.conf's :80 server block so the two stay identical
    # except for listen/ssl_* directives. $scheme in there resolves to
    # "https" here, so redirects it issues (e.g. the bare "/_proxy" ->
    # "/_proxy/" one) come back https:// automatically.
    include /etc/nginx/kp-locations.conf;
  }
}
